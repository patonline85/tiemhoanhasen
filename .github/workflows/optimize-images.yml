name: Tối ưu hóa dung lượng ảnh

on:
  workflow_dispatch: # Thêm dòng này để hiện nút "Run workflow" chạy bằng tay
  push:
    paths:
      - 'images/**' # Vẫn giữ lệnh tự động chạy khi có ảnh mới

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Nén ảnh (Compress Images)
        uses: calibreapp/image-actions@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          jpegQuality: '75'
          pngQuality: '80'
          webpQuality: '80'
