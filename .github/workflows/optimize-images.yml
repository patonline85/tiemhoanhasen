name: Tối ưu hóa dung lượng ảnh

on:
  workflow_dispatch: # Giữ lại nút chạy thủ công
  push:
    paths:
      - 'images/**'

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt phần mềm nén ảnh
        run: |
          sudo apt-get update
          sudo apt-get install -y jpegoptim optipng

      - name: Tiến hành nén ảnh
        run: |
          # Nén ảnh định dạng JPG/JPEG xuống chất lượng 75% và xóa dữ liệu thừa
          find images/ -type f \( -iname "*.jpg" -o -iname "*.jpeg" \) -exec jpegoptim -m75 --strip-all {} \;
          
          # Nén ảnh định dạng PNG (Tối ưu cấu trúc, giữ nguyên chất lượng)
          find images/ -type f -iname "*.png" -exec optipng -o5 {} \;

      - name: Lưu đè ảnh đã nén lên GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Tự động nén ảnh tối ưu dung lượng"
