    <style>
        :root {
            --primary-color: #e5989b;
            --bg-color: #fdfbfb;
            --text-color: #4a4a4a;
        }

        body { margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; background-color: var(--bg-color); color: var(--text-color); }
        
        /* Header & Tiêu đề */
        header { text-align: center; padding: 3rem 1rem 2rem; position: relative; overflow: hidden; }
        
        /* KHỐI CHỨA TIÊU ĐỀ VÀ HÌNH NỀN HOA SEN */
        .title-wrapper {
            position: relative;
            display: inline-block;
            padding: 30px 20px;
            margin-bottom: 5px;
        }

        /* HOA SEN LÀM NỀN CHÌM (WATERMARK) */
        .lotus-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Căn chính giữa khối chữ */
            width: 320px; /* Kích thước phù hợp với tỷ lệ vuông của SVG mới */
            height: auto;
            opacity: 0.08; /* Làm mờ 8% để tôn chữ lên */
            color: var(--primary-color);
            z-index: 0; /* Lớp dưới cùng */
            pointer-events: none; /* Không cản trở click */
        }

        .shop-title { 
            font-family: 'Dancing Script', cursive; 
            font-size: 4.8rem; 
            margin: 0; 
            color: var(--primary-color); 
            text-shadow: 2px 2px 4px rgba(229, 152, 155, 0.15);
            position: relative;
            z-index: 1; /* Lớp nổi lên trên hoa sen */
        }

        /* Phần Liên hệ Top */
        .contact-section { margin-top: 10px; position: relative; z-index: 2; }
        .contact-prompt { font-size: 1.1rem; color: #888; margin-bottom: 12px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }
        .social-links { display: flex; justify-content: center; gap: 20px; }
        .social-btn { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #fff; box-shadow: 0 6px 15px rgba(0,0,0,0.06); transition: all 0.3s ease; color: var(--primary-color); text-decoration: none; }
        .social-btn:hover { transform: translateY(-4px) scale(1.05); color: #d57a7d; box-shadow: 0 8px 20px rgba(229, 152, 155, 0.3); }
        .social-btn svg { width: 24px; height: 24px; fill: currentColor; }

        /* Tiêu đề mục */
        .section-title { text-align: center; font-family: 'Playfair Display', serif; font-size: 2.2rem; font-style: italic; margin: 3rem 0 2rem; font-weight: 600; color: #d57a7d; letter-spacing: 1px; }

        .gallery-container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }

        /* LƯỚI ẢNH LIỀN MẠCH */
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); grid-auto-rows: 200px; grid-auto-flow: dense; gap: 15px; margin-bottom: 3rem; }
        
        .image-card {
            position: relative; border-radius: 12px; cursor: pointer; box-shadow: 0 12px 25px rgba(229, 152, 155, 0.25); 
            opacity: 0; transform: translateY(30px); animation: fadeUpStagger 0.8s ease forwards;
            grid-column: span 1; grid-row: span 1; height: 100%; width: 100%; background: #f5f5f5;
        }

        .card-tall { grid-row: span 2; }
        .card-wide { grid-column: span 2; }
        .card-large { grid-column: span 2; grid-row: span 2; }

        .img-wrapper { width: 100%; height: 100%; border-radius: 12px; overflow: hidden; }
        
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease, opacity 0.8s ease-in-out; }
        .image-card:hover .img-wrapper img { transform: scale(1.08); }
        
        .img-fade-out { opacity: 0.1 !important; }
        @keyframes fadeUpStagger { to { opacity: 1; transform: translateY(0); } }

        /* LIGHTBOX (PHÓNG TO CÓ NÚT LIÊN HỆ) */
        .lightbox { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(253, 251, 251, 0.98);
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; 
        }
        
        .lightbox.active { opacity: 1; pointer-events: auto; }
        
        .lightbox-content { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .lightbox img { max-width: 90vw; max-height: 68vh; border-radius: 8px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); }
        
        .lightbox-contact {
            margin-top: 25px; display: flex; flex-direction: column; align-items: center;
            opacity: 0; transform: translateY(20px); transition: all 0.5s ease 0.2s; 
        }

        .lightbox.active .lightbox-contact { opacity: 1; transform: translateY(0); }
        .lightbox .contact-prompt { color: var(--primary-color); margin-bottom: 15px; font-weight: 600; }
        .lightbox .social-btn { box-shadow: 0 4px 10px rgba(0,0,0,0.08); }

        .close-lightbox { 
            position: absolute; top: 20px; right: 30px; font-size: 3rem; 
            color: var(--text-color); cursor: pointer; font-weight: 300; 
            transition: color 0.2s; z-index: 1001; 
        }
        .close-lightbox:hover { color: var(--primary-color); }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            .shop-title { font-size: 3.5rem; }
            .lotus-bg { width: 220px; } /* Thu nhỏ cho vừa đt */
            .title-wrapper { padding: 20px 10px; }
            .image-grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 140px; gap: 10px; }
            .card-wide, .card-large { grid-column: span 2; }
            .lightbox img { max-height: 60vh; } 
            .lightbox-contact { margin-top: 20px; }
            .close-lightbox { top: 10px; right: 20px; font-size: 2.5rem; }
        }

        /* Lớp CSS chuẩn SEO */
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0; }

    <script>
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        async function loadImages() {
            document.getElementById('new-flowers-grid').innerHTML = '<p style="text-align:center; width:100%; grid-column: 1 / -1; color: #e5989b;">Đang tải hoa...</p>';

            try {
                const response = await fetch('/.netlify/functions/getImages');
                if (!response.ok) throw new Error('Không thể tải dữ liệu');
                
                let allImages = await response.json();

                if (allImages.length === 0) {
                    document.getElementById('new-flowers-grid').innerHTML = '<p style="text-align:center; width:100%; grid-column: 1 / -1; color: #888;">Chưa có bông hoa nào được tải lên!</p>';
                    return;
                }

                let newImages = allImages.slice(0, 40); 
                let oldImages = allImages.slice(40, 60); 

                newImages = shuffleArray(newImages);
                oldImages = shuffleArray(oldImages);

                renderGrid('new-flowers-grid', newImages);
                renderGrid('old-flowers-grid', oldImages);

                startRandomSwapEffect();

            } catch (error) {
                document.getElementById('new-flowers-grid').innerHTML = '<p style="text-align:center; width:100%; grid-column: 1 / -1; color: #ff4d4d;">Lỗi khi tải dữ liệu ảnh.</p>';
            }
        }

        function renderGrid(containerId, images) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            images.forEach((src, index) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.style.animationDelay = `${index * 0.05}s`; 

                const randomShape = Math.random();
                if (randomShape > 0.9) { card.classList.add('card-large'); }
                else if (randomShape > 0.8) { card.classList.add('card-wide'); }
                else if (randomShape > 0.6) { card.classList.add('card-tall'); }

                card.innerHTML = `
                    <div class="img-wrapper">
                        <img src="${src}" loading="lazy" alt="Hoa Nhà Sen">
                    </div>
                `;
                
                card.addEventListener('click', () => {
                    const currentImgSrc = card.querySelector('img').src;
                    document.getElementById('lightbox-img').src = currentImgSrc;
                    document.getElementById('lightbox').classList.add('active');
                });
                
                container.appendChild(card);
            });
        }

        function startRandomSwapEffect() {
            setInterval(() => {
                const images = document.querySelectorAll('#new-flowers-grid .img-wrapper img');
                if (images.length < 2) return;

                let idx1 = Math.floor(Math.random() * images.length);
                let idx2 = Math.floor(Math.random() * images.length);
                while (idx1 === idx2) {
                    idx2 = Math.floor(Math.random() * images.length);
                }

                const img1 = images[idx1];
                const img2 = images[idx2];

                img1.classList.add('img-fade-out');
                img2.classList.add('img-fade-out');

                setTimeout(() => {
                    const tempSrc = img1.src;
                    img1.src = img2.src;
                    img2.src = tempSrc;

                    img1.classList.remove('img-fade-out');
                    img2.classList.remove('img-fade-out');
                }, 800);

            }, 3500); 
        }

        // Đóng Lightbox 
        document.getElementById('close-lightbox').addEventListener('click', () => { 
            document.getElementById('lightbox').classList.remove('active'); 
        });
        document.getElementById('lightbox').addEventListener('click', (e) => { 
            if (e.target.id === 'lightbox' || e.target.classList.contains('lightbox-content')) { 
                e.target.closest('.lightbox').classList.remove('active'); 
            }
        });

        loadImages();
    </script>
