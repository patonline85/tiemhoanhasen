<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiệm Hoa Nhà Sen</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,600;1,600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #e5989b;
            --bg-color: #fdfbfb;
            --text-color: #4a4a4a;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* Header & Tiêu đề */
        header {
            text-align: center;
            padding: 3rem 1rem 2rem;
            position: relative;
        }
        
        .shop-title {
            font-family: 'Dancing Script', cursive;
            font-size: 4.8rem;
            margin: 0 0 15px 0;
            color: var(--primary-color);
            text-shadow: 2px 2px 4px rgba(229, 152, 155, 0.15);
        }

        /* Phần Liên hệ */
        .contact-section { margin-top: 20px; }
        .contact-prompt { font-size: 1.1rem; color: #888; margin-bottom: 12px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }
        .social-links { display: flex; justify-content: center; gap: 20px; }
        
        .social-btn {
            width: 50px; height: 50px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: #fff; box-shadow: 0 6px 15px rgba(0,0,0,0.06);
            transition: all 0.3s ease; color: var(--primary-color); text-decoration: none;
        }
        .social-btn:hover { transform: translateY(-4px) scale(1.05); color: #d57a7d; box-shadow: 0 8px 20px rgba(229, 152, 155, 0.3); }
        .social-btn svg { width: 24px; height: 24px; fill: currentColor; }

        /* Tiêu đề mục */
        .section-title {
            text-align: center; font-family: 'Playfair Display', serif;
            font-size: 2.2rem; font-style: italic; margin: 3rem 0 2rem;
            font-weight: 600; color: #d57a7d; letter-spacing: 1px;
        }

        .gallery-container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }

        /* --- CẤU TRÚC LƯỚI ẢNH LIỀN MẠCH (MOSAIC) --- */
        .image-grid {
            display: grid;
            /* Đặt chiều rộng cột mặc định */
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            /* Đặt chiều cao hàng cố định để dễ dàng nhân đôi tỷ lệ */
            grid-auto-rows: 200px;
            /* Phép màu ở đây: Trình duyệt tự tìm ảnh nhỏ nhét vào khe hở */
            grid-auto-flow: dense; 
            gap: 15px;
            margin-bottom: 3rem;
        }

        .image-card {
            position: relative;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 12px 25px rgba(229, 152, 155, 0.25); 
            opacity: 0; 
            transform: translateY(30px);
            animation: fadeUpStagger 0.8s ease forwards;
            
            /* Kích thước ô nhỏ (mặc định) */
            grid-column: span 1;
            grid-row: span 1;
            height: 100%;
            width: 100%;
        }

        /* Các class biến thể tạo sự ngẫu nhiên lớn nhỏ */
        .card-tall { grid-row: span 2; } /* Ô cao */
        .card-wide { grid-column: span 2; } /* Ô rộng ngang */
        .card-large { grid-column: span 2; grid-row: span 2; } /* Ô to bự */

        .img-wrapper { width: 100%; height: 100%; border-radius: 12px; overflow: hidden; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .image-card:hover .img-wrapper img { transform: scale(1.08); }

        @keyframes fadeUpStagger { to { opacity: 1; transform: translateY(0); } }

        /* Lightbox (Phóng to ảnh) */
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95); display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        .lightbox img { max-width: 90%; max-height: 90vh; border-radius: 8px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); }
        .close-lightbox { position: absolute; top: 20px; right: 30px; font-size: 2.5rem; color: var(--text-color); cursor: pointer; font-weight: bold; transition: color 0.2s; }
        .close-lightbox:hover { color: var(--primary-color); }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            .shop-title { font-size: 3.5rem; }
            .image-grid {
                grid-template-columns: repeat(2, 1fr); /* Tối đa 2 cột trên đt */
                grid-auto-rows: 140px; /* Hạ thấp chiều cao cơ sở trên đt */
                gap: 10px;
            }
            /* Trên điện thoại ô rộng sẽ chiếm cả màn hình, ô lớn cũng vậy */
            .card-wide, .card-large { grid-column: span 2; }
        }
    </style>
</head>
<body>

    <header>
        <h1 class="shop-title">Tiệm Hoa Nhà Sen</h1>
        
        <div class="contact-section">
            <div class="contact-prompt">— Liên hệ Ngay —</div>
            <div class="social-links">
                <a href="http://zaloapp.com/qr/p/tljmod5q6mj1" class="social-btn" title="Zalo" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24"><path d="M21 11.5c0-4.14-3.58-7.5-8-7.5s-8 3.36-8 7.5c0 1.95 0.81 3.73 2.15 5.1l-1.35 3.32c-0.1 0.25 0.17 0.5 0.4 0.37l3.87-2.14c0.92 0.27 1.9 0.42 2.93 0.42 4.42 0 8-3.36 8-7.5z" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="12" y="15.5" font-size="7.5" font-family="Arial" font-weight="bold" text-anchor="middle" fill="currentColor">Zalo</text></svg>
                </a>
                <a href="https://m.me/tiemhoanhasen.com.vn" class="social-btn" title="Messenger" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.13 2 11.23c0 2.91 1.48 5.49 3.79 7.18V22l3.46-1.9c1.07 0.3 2.22 0.47 3.42 0.47 5.52 0 10-4.13 10-9.23S17.52 2 12 2zm1.18 12.35l-3.08-3.29-6.02 3.29 6.64-7.05 3.1 3.29 5.99-3.29-6.63 7.05z"/></svg>
                </a>
                <a href="https://www.facebook.com/tiemhoanhasen.com.vn" class="social-btn" title="Facebook" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H7v-3h3V9.5C10 6.53 11.75 5 14.43 5c1.31 0 2.68.23 2.68.23v2.95h-1.51c-1.49 0-1.95.93-1.95 1.88V12h3.32l-.53 3h-2.79v6.8C18.56 20.87 22 16.84 22 12z"/></svg>
                </a>
            </div>
        </div>
    </header>

    <div class="gallery-container">
        <div class="section-title">Mùa Hoa Nở</div>
        <div class="image-grid" id="new-flowers-grid"></div>

        <div class="section-title">Cùng Khoe Sắc</div>
        <div class="image-grid" id="old-flowers-grid"></div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <span class="close-lightbox" id="close-lightbox">&times;</span>
        <img id="lightbox-img" src="" alt="Zoomed Flower">
    </div>

    <script>
        // Hàm đảo lộn ngẫu nhiên (Shuffle Array)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        async function loadImages() {
            document.getElementById('new-flowers-grid').innerHTML = '<p style="text-align:center; width:100%; grid-column: 1 / -1; color: #e5989b;">Đang tải hoa...</p>';

            try {
                const response = await fetch('/.netlify/functions/getImages');
                if (!response.ok) throw new Error('Không thể tải dữ liệu');
                
                let allImages = await response.json();

                if (allImages.length === 0) {
                    document.getElementById('new-flowers-grid').innerHTML = '<p style="text-align:center; width:100%; grid-column: 1 / -1; color: #888;">Chưa có bông hoa nào được tải lên!</p>';
                    return;
                }

                // Cắt 20 ảnh đầu và 10 ảnh sau
                let newImages = allImages.slice(0, 20);
                let oldImages = allImages.slice(20, 30);

                // Trộn ngẫu nhiên vị trí các ảnh bên trong mỗi vùng
                newImages = shuffleArray(newImages);
                oldImages = shuffleArray(oldImages);

                renderGrid('new-flowers-grid', newImages);
                renderGrid('old-flowers-grid', oldImages);
            } catch (error) {
                document.getElementById('new-flowers-grid').innerHTML = '<p style="text-align:center; width:100%; grid-column: 1 / -1; color: #ff4d4d;">Lỗi khi tải dữ liệu ảnh.</p>';
            }
        }

        function renderGrid(containerId, images) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            images.forEach((src, index) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.style.animationDelay = `${index * 0.05}s`; 

                // Thuật toán gán kích thước ô ngẫu nhiên
                // Xác suất: ~60% ô nhỏ thường, 20% ô cao, 10% ô rộng ngang, 10% ô to bự
                const randomShape = Math.random();
                if (randomShape > 0.9) {
                    card.classList.add('card-large');
                } else if (randomShape > 0.8) {
                    card.classList.add('card-wide');
                } else if (randomShape > 0.6) {
                    card.classList.add('card-tall');
                }

                card.innerHTML = `
                    <div class="img-wrapper">
                        <img src="${src}" loading="lazy" alt="Hoa Nhà Sen">
                    </div>
                `;
                
                card.addEventListener('click', () => {
                    document.getElementById('lightbox-img').src = src;
                    document.getElementById('lightbox').classList.add('active');
                });
                
                container.appendChild(card);
            });
        }

        // Đóng Lightbox
        document.getElementById('close-lightbox').addEventListener('click', () => {
            document.getElementById('lightbox').classList.remove('active');
        });
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') { e.target.classList.remove('active'); }
        });

        loadImages();
    </script>
</body>
</html>
