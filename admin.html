<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Tiệm Hoa Nhà Sen</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Tích hợp thư viện nén ảnh Client-side -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Quicksand', sans-serif; background-color: #f4f4f9; padding: 2rem; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        
        .container { background: #fff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 600px; height: fit-content; }
        h2 { color: #e5989b; text-align: center; margin-top: 0; font-size: 1.8rem; }
        
        /* Form Đăng nhập */
        #login-section { display: flex; flex-direction: column; gap: 15px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; outline: none; transition: border 0.3s; }
        .input-group input:focus { border-color: #e5989b; }
        .btn { background: #e5989b; color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 600; width: 100%; transition: background 0.3s; }
        .btn:hover { background: #d57a7d; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        
        /* Bảng Quản trị */
        #admin-section { display: none; }
        .header-admin { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .logout-btn { background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        
        .upload-area { border: 2px dashed #e5989b; padding: 2rem; text-align: center; border-radius: 8px; background: #fffafb; margin-bottom: 15px; transition: 0.3s; }
        .upload-area.disabled { opacity: 0.5; pointer-events: none; }
        .upload-area input { display: none; }
        .upload-btn-label { background: #e5989b; color: white; padding: 10px 20px; border-radius: 5px; cursor: pointer; display: inline-block; font-weight: 600; transition: background 0.3s;}
        .upload-btn-label:hover { background: #d57a7d; }
        
        #status { text-align: center; font-weight: bold; margin-top: 15px; min-height: 24px; color: #4a4a4a; }
        .error-msg { color: #ff4d4d; font-size: 0.9rem; text-align: center; min-height: 20px; }

        /* Giao diện Danh sách Tiến trình Upload */
        #progress-list { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; max-height: 300px; overflow-y: auto; padding-right: 5px; }
        .progress-item { background: #fff; border: 1px solid #eee; padding: 12px 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .progress-info { display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
        .file-name { font-weight: 600; color: #4a4a4a; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }
        .file-meta { color: #888; font-size: 0.8rem; }
        .status-badge { padding: 5px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; text-align: center; min-width: 90px; }
        
        /* Màu sắc các trạng thái */
        .status-waiting { background: #e2e3e5; color: #383d41; }
        .status-compressing { background: #fff3cd; color: #856404; }
        .status-uploading { background: #cce5ff; color: #004085; }
        .status-success { background: #d4edda; color: #155724; }
        .status-error { background: #f8d7da; color: #721c24; }
        
        /* Tùy chỉnh thanh cuộn */
        #progress-list::-webkit-scrollbar { width: 6px; }
        #progress-list::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- GIAO DIỆN ĐĂNG NHẬP -->
        <div id="login-section">
            <h2>Đăng Nhập Quản Trị</h2>
            <div class="error-msg" id="login-error"></div>
            <div class="input-group">
                <label>Tài khoản</label>
                <input type="text" id="username" placeholder="Nhập tên đăng nhập">
            </div>
            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu">
            </div>
            <button class="btn" id="login-btn" onclick="handleLogin()">Đăng Nhập</button>
        </div>

        <!-- GIAO DIỆN QUẢN TRỊ (UPLOAD) -->
        <div id="admin-section">
            <div class="header-admin">
                <h2 style="margin: 0; font-size: 1.5rem;">Upload Hoa Mới</h2>
                <button class="logout-btn" onclick="handleLogout()">Đăng xuất</button>
            </div>
            
            <div class="upload-area" id="upload-area">
                <p>Ảnh sẽ được <b>tự động nén</b> trước khi đưa lên hệ thống.</p>
                <label class="upload-btn-label" for="file-input">Chọn Ảnh Upload</label>
                <input type="file" id="file-input" multiple accept="image/*">
            </div>
            
            <div id="status"></div>

            <!-- Danh sách tiến trình nén & upload -->
            <div id="progress-list"></div>
        </div>

    </div>

    <script>
        const loginSection = document.getElementById('login-section');
        const adminSection = document.getElementById('admin-section');
        const statusDiv = document.getElementById('status');
        const loginError = document.getElementById('login-error');
        const fileInput = document.getElementById('file-input');
        const progressList = document.getElementById('progress-list');
        const uploadArea = document.getElementById('upload-area');

        // Hàm chuyển đổi Byte sang KB / MB cho dễ đọc
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        window.onload = () => {
            if (sessionStorage.getItem('sen_auth_user') && sessionStorage.getItem('sen_auth_pass')) {
                showAdmin();
            }
        };

        async function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const btn = document.getElementById('login-btn');

            if(!user || !pass) {
                loginError.innerText = "Vui lòng nhập đủ thông tin!";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Đang kiểm tra...";
            loginError.innerText = "";

            try {
                const res = await fetch('/.netlify/functions/upload', {
                    method: 'POST',
                    body: JSON.stringify({ action: 'verify', username: user, password: pass })
                });
                
                const data = await res.json();

                if(res.status === 200) {
                    sessionStorage.setItem('sen_auth_user', user);
                    sessionStorage.setItem('sen_auth_pass', pass);
                    showAdmin();
                } else {
                    loginError.innerText = data.message || "Đăng nhập thất bại!";
                }
            } catch (error) {
                loginError.innerText = "Lỗi kết nối máy chủ!";
            } finally {
                btn.disabled = false;
                btn.innerText = "Đăng Nhập";
            }
        }

        function handleLogout() {
            sessionStorage.removeItem('sen_auth_user');
            sessionStorage.removeItem('sen_auth_pass');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            adminSection.style.display = 'none';
            loginSection.style.display = 'flex';
            progressList.innerHTML = '';
            statusDiv.innerText = '';
        }

        function showAdmin() {
            loginSection.style.display = 'none';
            adminSection.style.display = 'block';
            statusDiv.innerText = "";
        }

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            const user = sessionStorage.getItem('sen_auth_user');
            const pass = sessionStorage.getItem('sen_auth_pass');

            // Khóa khu vực upload để tránh chọn thêm file khi đang chạy
            uploadArea.classList.add('disabled');
            progressList.innerHTML = ''; 
            statusDiv.style.color = '#e5989b';
            statusDiv.innerText = `Đang xử lý ${files.length} ảnh... Vui lòng không đóng trang.`;

            let successCount = 0;

            // Cấu hình Nén Ảnh
            const compressionOptions = {
                maxSizeMB: 0.5, // Nén tối đa 500KB
                maxWidthOrHeight: 1080, // Chiều ngang/dọc tối đa 1080px
                useWebWorker: true // Tăng tốc nén bằng Web Worker
            };

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const fileId = 'file-' + i;
                const originalSize = formatBytes(file.size);

                // Tạo UI cho ảnh hiện tại
                const progressItem = document.createElement('div');
                progressItem.className = 'progress-item';
                progressItem.innerHTML = `
                    <div class="progress-info">
                        <span class="file-name" title="${file.name}">${file.name}</span>
                        <span class="file-meta" id="meta-${fileId}">Gốc: ${originalSize} | Chờ xử lý...</span>
                    </div>
                    <div class="status-badge status-compressing" id="badge-${fileId}">Đang nén...</div>
                `;
                progressList.appendChild(progressItem);
                
                // Tự động cuộn xuống cuối danh sách
                progressList.scrollTop = progressList.scrollHeight;

                try {
                    const metaSpan = document.getElementById(`meta-${fileId}`);
                    const badgeSpan = document.getElementById(`badge-${fileId}`);

                    // 1. TIẾN HÀNH NÉN ẢNH
                    const compressedFile = await imageCompression(file, compressionOptions);
                    const compressedSize = formatBytes(compressedFile.size);
                    metaSpan.innerText = `Gốc: ${originalSize} ➔ Nén: ${compressedSize}`;

                    // 2. CHUYỂN SANG TRẠNG THÁI UPLOAD
                    badgeSpan.className = 'status-badge status-uploading';
                    badgeSpan.innerText = 'Đang Upload...';

                    // Chuyển file đã nén sang Base64
                    const base64Data = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.readAsDataURL(compressedFile);
                        reader.onload = (event) => resolve(event.target.result);
                        reader.onerror = (error) => reject(error);
                    });

                    const fileName = Date.now() + "_" + file.name.replace(/\s+/g, '-'); 

                    // 3. GỬI LÊN GITHUB QUA NETLIFY FUNCTION
                    const res = await fetch('/.netlify/functions/upload', {
                        method: 'POST',
                        body: JSON.stringify({
                            username: user,
                            password: pass,
                            image: base64Data,
                            filename: fileName
                        })
                    });
                    
                    if(res.status === 200) {
                        badgeSpan.className = 'status-badge status-success';
                        badgeSpan.innerText = 'Thành công';
                        successCount++;
                    } else if (res.status === 401) {
                        alert("Phiên đăng nhập hết hạn hoặc sai mật khẩu!");
                        handleLogout();
                        break; // Dừng vòng lặp nếu lỗi xác thực
                    } else {
                        throw new Error("Lỗi Server trả về");
                    }

                } catch (error) {
                    console.error("Lỗi xử lý file: ", file.name, error);
                    const badgeSpan = document.getElementById(`badge-${fileId}`);
                    badgeSpan.className = 'status-badge status-error';
                    badgeSpan.innerText = 'Thất bại';
                }
            }

            // Hoàn tất
            uploadArea.classList.remove('disabled');
            fileInput.value = ''; 

            if(successCount === files.length) {
                statusDiv.style.color = '#4CAF50';
                statusDiv.innerText = `Hoàn tất xuất sắc! Đã tải lên ${successCount}/${files.length} ảnh.`;
            } else if (successCount > 0) {
                statusDiv.style.color = '#e5989b';
                statusDiv.innerText = `Hoàn tất một phần: ${successCount}/${files.length} ảnh thành công.`;
            } else {
                statusDiv.style.color = '#ff4d4d';
                statusDiv.innerText = "Tải lên thất bại toàn bộ. Vui lòng thử lại!";
            }
        });
    </script>
</body>
</html>
